name: Android build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clean, build and test
        run: gradle clean build --no-build-cache --stacktrace

      - name: Assemble clean debug APK
        run: gradle clean :apps:android:assembleDebug --no-build-cache --stacktrace

      - name: Verify APK matches current demo UI
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find apps/android/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"

          dex_dir="$(mktemp -d)"
          apk_text="$(mktemp)"
          trap 'rm -rf "$dex_dir" "$apk_text"' EXIT

          unzip -q "$apk" 'classes*.dex' -d "$dex_dir"
          : > "$apk_text"
          find "$dex_dir" -name 'classes*.dex' -print0 | while IFS= read -r -d '' dex; do
            strings "$dex" >> "$apk_text"
          done

          if ! grep -Fq "Know what's" "$apk_text"; then
            echo "APK UI verification failed: current demo UI marker was not found."
            exit 1
          fi
          if grep -Fq "Ready to scan" "$apk_text"; then
            echo "APK UI verification failed: stale UI marker is still packaged."
            exit 1
          fi

          echo "APK UI verification passed: current demo UI is packaged."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foodlense-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
